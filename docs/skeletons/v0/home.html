<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptSharp — Home / Skeleton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Typography:
      Mona Sans — variable sans-serif (width 75–125, weight 200–900, italic)
      IBM Plex Mono — technical accents, eyebrows, labels
    Two sans families. No serif anywhere.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       PromptSharp · Home (skeleton)
       Composed entirely of autonomous custom elements following
       the MDN pattern in "Using custom elements" — each <ps-*>
       and <sk-*> tag is a real class that extends HTMLElement
       and renders its own template in connectedCallback().

       <ps-*> components use light DOM so this global stylesheet
       applies cleanly to the magazine grid.
       <sk-*> primitives use shadow DOM (encapsulated styles).
       ========================================================= */

    :root {
      /* Palette: Adobe Color — near-black + crisp white + deep navy
         + periwinkle accent + warm orange signal.
         #00000F → #002A54 → #8AA8FF (cool) · #FF9800 (warm) · #FBFFFF (ink) */
      --bg:         #00000F;
      --surface:    #002A54;
      --surface-2:  #003E80AA;
      --rule:       #003E80;
      --rule-soft:  #001A36;

      --skel:       #002A54;
      --skel-hi:    #003E80;

      --ink:        #FBFFFF;
      --ink-dim:    #C5CDE4;
      --muted:      #6B7AAF;
      --hush:       #3A4880;

      --accent:     #FF9800;   /* signal — vibrant orange */
      --accent-2:   #8AA8FF;   /* periwinkle — cool secondary */
      --gold:       #FFC85C;   /* intermediate badge — lighter orange */
      --moss:       #8AA8FF;   /* beginner badge — periwinkle */

      --sans:       "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:       "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

      --max-w:      1440px;
      --gutter:     clamp(20px, 4vw, 64px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: var(--sans);
      font-variation-settings: "wdth" 100, "wght" 400;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(255, 152, 0, 0.18), transparent 60%),
        radial-gradient(900px 500px at -10% 30%, rgba(138, 168, 255, 0.10), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(251, 255, 255, 0.014) 3px 4px);
    }

    /* ---------- Reusable display typography ---------- */
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow .dot {
      display: inline-block; width: 6px; height: 6px;
      background: var(--accent); margin-right: 10px; vertical-align: middle;
    }
    .mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--ink-dim); }

    .display {
      font-family: var(--sans);
      font-variation-settings: "wdth" 75, "wght" 600;
      letter-spacing: -0.035em;
      line-height: 0.92;
      color: var(--ink);
    }
    .display em {
      font-style: italic;
      font-variation-settings: "wdth" 85, "wght" 500;
      color: var(--accent);
    }

    .rule { height: 1px; background: var(--rule); width: 100%; }

    /* =========================================================
       SHELL
       ========================================================= */
    ps-shell {
      display: block;
      position: relative; z-index: 1;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    /* =========================================================
       NAV
       ========================================================= */
    /* Full-viewport sticky bar. The bar itself bleeds edge to edge so the
       bottom rule and glass background span the whole screen; the contents
       sit inside an inner container that tracks ps-shell's max-width. */
    ps-nav {
      display: block;
      position: sticky; top: 0;
      border-bottom: 1px solid var(--rule);
      background: rgba(0, 0, 15, 0.82);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      z-index: 50;
    }
    ps-nav .inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 32px;
      max-width: var(--max-w);
      margin: 0 auto;
      /* Tracks ps-shell's gutter, plus the 12px symmetric inset so the
         brand and Sign-in button breathe away from the gutter line. */
      padding: 24px calc(var(--gutter) + 12px) 22px calc(var(--gutter) + 12px);
    }
    /* Brand mirrors the foot-mark recipe (condensed wdth + heavy wght
       + italic accent slash) so the wordmark is consistent across the page. */
    .brand {
      font-family: var(--sans);
      font-variation-settings: "wdth" 82, "wght" 700;
      font-size: 24px;
      letter-spacing: -0.035em;
      line-height: 1;
      display: inline-flex; align-items: baseline; gap: 0;
    }
    .brand .slash {
      color: var(--accent); font-style: italic;
      font-variation-settings: "wdth" 92, "wght" 500;
    }
    ps-nav .links {
      display: flex; gap: 32px; justify-content: center;
      font-size: 13px; color: var(--ink-dim);
    }
    /* Active link sits as a tab indicator overlapping ps-nav's bottom border.
       The -22px matches ps-nav's padding-bottom so the strip lands on the rule. */
    ps-nav .links span { position: relative; padding-bottom: 4px; cursor: pointer; }
    ps-nav .links span.active { color: var(--ink); }
    ps-nav .links span.active::after {
      content: ""; position: absolute; left: -4px; right: -4px; bottom: -22px;
      height: 2px; background: var(--accent);
    }
    ps-nav .actions {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--mono); font-size: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 22px; border: 1px solid var(--rule);
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink); background: transparent; cursor: pointer;
      line-height: 1;
    }
    .btn.solid { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .btn.ghost { color: var(--ink-dim); }
    .btn.ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
    .btn .arr { display: inline-block; transform: translateY(-1px); }

    /* =========================================================
       HERO
       ========================================================= */
    ps-hero {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 48px;
      padding: 80px 0 64px;
      border-bottom: 1px solid var(--rule);
      align-items: end;
    }
    ps-hero h1.display { font-size: clamp(56px, 9vw, 132px); margin: 0 0 28px; }
    ps-hero .lede {
      max-width: 38ch; color: var(--ink-dim);
      font-size: 17px; line-height: 1.55;
      margin-bottom: 32px;
    }
    ps-hero .lede strong { color: var(--ink); font-weight: 500; }
    ps-hero .ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
    ps-hero .hero-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--rule);
      padding-top: 18px; max-width: 520px;
    }
    .stat { display: flex; flex-direction: column; gap: 6px; padding-right: 16px; }
    .stat .n {
      font-family: var(--sans);
      font-variation-settings: "wdth" 80, "wght" 600;
      font-size: 28px; letter-spacing: -0.02em;
    }
    .stat .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

    .hero-card {
      border: 1px solid var(--rule);
      background:
        linear-gradient(180deg, transparent, rgba(255, 152, 0, 0.08)),
        var(--surface);
      padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      position: relative;
    }
    .hero-card::before {
      content: "FEATURED";
      position: absolute; top: -1px; left: -1px;
      background: var(--accent); color: var(--bg);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
      padding: 4px 10px; font-weight: 600;
    }
    .hero-card .thumb { aspect-ratio: 16/10; position: relative; overflow: hidden; }
    .hero-card .thumb-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 12px; pointer-events: none;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
      padding: 4px 8px; background: var(--bg); color: var(--ink);
      border: 1px solid var(--rule);
    }
    .chip.accent { color: var(--accent); border-color: var(--accent); }
    .hero-card h3 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 85, "wght" 550;
      font-size: 26px; letter-spacing: -0.02em;
      line-height: 1.1; margin: 0;
    }
    .hero-card .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--rule); padding-top: 14px;
      font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
    }

    /* =========================================================
       MARQUEE
       ========================================================= */
    ps-marquee {
      display: block;
      border-bottom: 1px solid var(--rule);
      padding: 20px 0;
      overflow: hidden;
      position: relative;
    }
    ps-marquee .strip {
      display: flex; gap: 56px; align-items: center;
      white-space: nowrap;
      animation: scroll 40s linear infinite;
      font-family: var(--mono); font-size: 12px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    ps-marquee .strip span.dot { color: var(--accent); }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* =========================================================
       SECTION HEADER
       ========================================================= */
    .sect-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 32px;
      padding: 64px 0 32px;
    }
    .sect-head h2 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 78, "wght" 600;
      font-size: clamp(34px, 4.4vw, 56px);
      margin: 0; letter-spacing: -0.035em; line-height: 1;
    }
    .sect-head h2 em {
      font-style: italic; color: var(--accent);
      font-variation-settings: "wdth" 88, "wght" 500;
    }
    .sect-head .lead-col { max-width: 36ch; color: var(--ink-dim); font-size: 14px; }
    .sect-head .more {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink); padding-bottom: 4px;
      border-bottom: 1px solid var(--accent);
      cursor: pointer;
    }

    /* =========================================================
       FEATURED
       ========================================================= */
    ps-featured { display: block; }
    .feat-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
      padding-bottom: 64px;
      border-bottom: 1px solid var(--rule);
    }
    .feat-card {
      border: 1px solid var(--rule);
      background: var(--surface);
      display: flex; flex-direction: column;
      position: relative;
    }
    .feat-card.span-5 { grid-column: span 5; }
    .feat-card.span-4 { grid-column: span 4; }
    .feat-card.span-3 { grid-column: span 3; }
    .feat-card .num {
      position: absolute; top: 12px; right: 12px;
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 0.12em;
      z-index: 1;
    }
    .feat-card .thumb-wrap { aspect-ratio: 16 / 10; position: relative; overflow: hidden; }
    .feat-card .badges {
      position: absolute; top: 12px; left: 12px;
      display: flex; gap: 6px;
    }
    .feat-card .body {
      padding: 18px 20px 22px;
      display: flex; flex-direction: column; gap: 12px;
      flex: 1;
    }
    .feat-card h3 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 88, "wght" 550;
      font-size: 22px; letter-spacing: -0.025em;
      line-height: 1.15; margin: 0;
      min-height: 56px;
    }
    .feat-card .lines { display: flex; flex-direction: column; gap: 6px; }
    .feat-card footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
      letter-spacing: 0.06em;
    }
    .feat-card footer .steps b { color: var(--accent); font-weight: 600; }

    /* =========================================================
       TRACKS
       ========================================================= */
    ps-tracks { display: block; }
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
    }
    .track-cell {
      padding: 28px 24px 24px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: flex; flex-direction: column; gap: 14px;
      min-height: 220px;
      background: var(--bg);
      transition: background .3s ease;
      cursor: pointer;
    }
    .track-cell:hover { background: var(--surface); }
    .track-cell .index {
      font-family: var(--mono); font-size: 10px;
      color: var(--accent); letter-spacing: 0.2em;
    }
    .track-cell h3 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 80, "wght" 600;
      font-size: 28px; letter-spacing: -0.03em;
      line-height: 1; margin: 0;
    }
    .track-cell .glyph {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--rule);
      font-family: var(--mono); color: var(--ink-dim); font-size: 18px;
    }
    .track-cell .count {
      margin-top: auto;
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
      letter-spacing: 0.08em;
    }
    .track-cell .count .arr { color: var(--accent); }

    /* =========================================================
       LATEST
       ========================================================= */
    ps-latest { display: block; }
    .latest-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      padding-bottom: 72px;
      border-bottom: 1px solid var(--rule);
    }
    .latest-side { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
    .filter-chip {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 11px; padding: 8px 0;
      border-bottom: 1px solid var(--rule-soft);
      color: var(--ink-dim); letter-spacing: 0.06em;
      cursor: pointer;
    }
    .filter-chip.on { color: var(--ink); }
    .filter-chip.on::before { content: "■"; color: var(--accent); margin-right: 10px; }
    .filter-chip .n { color: var(--muted); }

    .latest-list { display: flex; flex-direction: column; }
    .row {
      display: grid;
      grid-template-columns: 50px 1fr auto auto auto;
      gap: 24px; align-items: center;
      padding: 22px 0;
      border-top: 1px solid var(--rule);
    }
    .row:hover { background: linear-gradient(90deg, transparent, rgba(255, 152, 0, 0.08), transparent); }
    .row .ix { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
    .row .title {
      font-family: var(--sans);
      font-variation-settings: "wdth" 90, "wght" 550;
      font-size: 22px; letter-spacing: -0.02em; line-height: 1.2;
    }
    .row .title small {
      display: block;
      font-family: var(--sans);
      font-variation-settings: "wdth" 100, "wght" 400;
      font-size: 12px; letter-spacing: 0;
      color: var(--ink-dim); margin-top: 4px;
    }
    .row .stack {
      font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
      letter-spacing: 0.06em;
    }
    .row .diff {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.16em; text-transform: uppercase;
      padding: 4px 8px; border: 1px solid var(--rule);
    }
    .row .diff.b { color: var(--moss); border-color: var(--moss); }
    .row .diff.i { color: var(--gold); border-color: var(--gold); }
    .row .diff.a { color: var(--accent); border-color: var(--accent); }
    .row .time { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

    /* =========================================================
       FOOTER
       ========================================================= */
    ps-footer { display: block; padding: 64px 0 28px; }
    .foot-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 32px;
      padding-bottom: 48px;
    }
    .foot-grid h4 {
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 18px;
    }
    .foot-grid ul {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 10px;
      font-size: 13px; color: var(--ink-dim);
    }
    .foot-mark {
      font-family: var(--sans);
      font-variation-settings: "wdth" 80, "wght" 700;
      font-size: 64px; line-height: 1;
      letter-spacing: -0.05em; margin-bottom: 18px;
    }
    .foot-mark em {
      color: var(--accent); font-style: italic;
      font-variation-settings: "wdth" 90, "wght" 500;
    }
    .foot-bottom {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 22px; border-top: 1px solid var(--rule);
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    .colophon { display: flex; gap: 24px; }
    .colophon .build::before {
      content: "●"; color: var(--accent); margin-right: 8px; font-size: 8px;
    }

    /* =========================================================
       Responsive
       ========================================================= */
    @media (max-width: 1100px) {
      ps-hero { grid-template-columns: 1fr; }
      .feat-card.span-5, .feat-card.span-4, .feat-card.span-3 { grid-column: span 6; }
      .tracks-grid { grid-template-columns: repeat(2, 1fr); }
      .foot-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      ps-nav .inner {
        grid-template-columns: 1fr auto;
        gap: 16px;
        padding: 20px calc(var(--gutter) + 8px) 18px calc(var(--gutter) + 8px);
      }
      ps-nav .links { display: none; }
      .feat-grid { grid-template-columns: 1fr; }
      .feat-card.span-5, .feat-card.span-4, .feat-card.span-3 { grid-column: span 1; }
      .latest-grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 36px 1fr; row-gap: 8px; }
      .row .stack, .row .diff, .row .time { grid-column: 2; }
      .sect-head { grid-template-columns: 1fr; gap: 16px; }
      .foot-grid { grid-template-columns: 1fr; }
      .foot-bottom { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <!--
    The entire page is a single autonomous custom element.
    <ps-shell> renders the rest of the page composition itself —
    see customElements.define(...) at the bottom of this file.
  -->
  <!-- ps-nav lives outside ps-shell so the sticky bar spans the full viewport
       while its contents stay inside the max-width container. -->
  <ps-nav></ps-nav>
  <ps-shell></ps-shell>

  <script type="module">
    /* =========================================================
       Web Components — per MDN "Using custom elements".
       https://developer.mozilla.org/en-US/docs/Web/API/Web_components/Using_custom_elements

       Each tag below is an autonomous custom element:
         class X extends HTMLElement { connectedCallback() {…} }
         customElements.define("x-name", X);

       <ps-*> sections use light DOM (this.innerHTML = …) so the
       global stylesheet styles them.

       <sk-*> primitives use shadow DOM (attachShadow + scoped
       <style>) because they're self-contained shimmer atoms.
       ========================================================= */

    /* ---------- Light-DOM base ---------- */
    class LightElement extends HTMLElement {
      connectedCallback() {
        if (this.#rendered) return;
        this.innerHTML = this.render();
        this.#rendered = true;
      }
      #rendered = false;
      render() { return ""; }
    }

    /* ---------- Skeleton primitives (shadow DOM) ---------- */
    const SHIMMER_SHEET = new CSSStyleSheet();
    SHIMMER_SHEET.replaceSync(`
      :host {
        display: block;
        background:
          linear-gradient(
            100deg,
            #002A54 0%,
            #002A54 28%,
            #003E80 50%,
            #002A54 72%,
            #002A54 100%
          );
        background-size: 220% 100%;
        animation: shimmer 3.2s cubic-bezier(.4,0,.2,1) infinite;
        border: 1px solid #001A36;
      }
      :host([delay="1"]) { animation-delay: -1.1s; }
      :host([delay="2"]) { animation-delay: -2.0s; }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    `);

    class SkLine extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.adoptedStyleSheets = [SHIMMER_SHEET];
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`
          :host { height: 12px; }
          :host([size="lg"]) { height: 18px; }
          :host([size="xl"]) { height: 28px; }
          :host([size="sm"]) { height: 8px; }
        `);
        root.adoptedStyleSheets = [SHIMMER_SHEET, sheet];
      }
      static get observedAttributes() { return ["w"]; }
      connectedCallback() { this.#applyWidth(); }
      attributeChangedCallback() { this.#applyWidth(); }
      #applyWidth() {
        const w = this.getAttribute("w");
        if (w) this.style.width = `${w}%`;
      }
    }

    class SkTile extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`:host { aspect-ratio: 4 / 3; width: 100%; }`);
        root.adoptedStyleSheets = [SHIMMER_SHEET, sheet];
      }
    }

    class SkCircle extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(`:host { border-radius: 50%; aspect-ratio: 1; width: 40px; }`);
        root.adoptedStyleSheets = [SHIMMER_SHEET, sheet];
      }
    }
