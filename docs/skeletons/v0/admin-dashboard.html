<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptSharp · Admin Dashboard / Skeleton</title>

  <!--
    Authenticated admin screens use Google Material Design 3.
    Public/anonymous screens (home, signin, catalog) use the editorial
    brutalist system. Both share the same brand palette.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet"
  />

  <!-- Material 3 Web Components (official @material/web) -->
  <script type="importmap">
  {
    "imports": {
      "@material/web/": "https://esm.run/@material/web/"
    }
  }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    /* =========================================================
       Material 3 sys color tokens — dark theme,
       mapped to our navy + orange + periwinkle palette.
       Every <md-*> component picks these up automatically.
       ========================================================= */
    :root {
      --md-sys-color-primary:                #FF9800;
      --md-sys-color-on-primary:             #00000F;
      --md-sys-color-primary-container:      #4A2F00;
      --md-sys-color-on-primary-container:   #FFDAA8;

      --md-sys-color-secondary:              #8AA8FF;
      --md-sys-color-on-secondary:           #00000F;
      --md-sys-color-secondary-container:    #2A3970;
      --md-sys-color-on-secondary-container: #D8E2FF;

      --md-sys-color-tertiary:               #FFC85C;
      --md-sys-color-on-tertiary:            #00000F;
      --md-sys-color-tertiary-container:     #4D3800;
      --md-sys-color-on-tertiary-container:  #FFE0A3;

      --md-sys-color-error:                  #FFB4AB;
      --md-sys-color-on-error:               #690005;
      --md-sys-color-error-container:        #93000A;
      --md-sys-color-on-error-container:     #FFDAD6;

      --md-sys-color-surface:                #00000F;
      --md-sys-color-on-surface:             #FBFFFF;
      --md-sys-color-on-surface-variant:     #C5CDE4;
      --md-sys-color-surface-dim:            #00000A;
      --md-sys-color-surface-bright:         #1A2438;

      --md-sys-color-surface-container-lowest:  #00000A;
      --md-sys-color-surface-container-low:     #0A1428;
      --md-sys-color-surface-container:         #0F1A30;
      --md-sys-color-surface-container-high:    #002A54;
      --md-sys-color-surface-container-highest: #003E80;

      --md-sys-color-outline:                #6B7AAF;
      --md-sys-color-outline-variant:        #3A4880;

      --md-sys-color-inverse-surface:        #FBFFFF;
      --md-sys-color-inverse-on-surface:     #00000F;
      --md-sys-color-inverse-primary:        #FF9800;

      --md-sys-color-scrim:                  #000000;
      --md-sys-color-shadow:                 #000000;

      /* Make every M3 typescale slot use Roboto Flex */
      --md-ref-typeface-brand: 'Roboto Flex', system-ui, sans-serif;
      --md-ref-typeface-plain: 'Roboto Flex', system-ui, sans-serif;

      /* App chrome dimensions */
      --topbar-h: 64px;
      --rail-w:   240px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: 'Roboto Flex', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Material Symbols base */
    .ico, .nav-item .ico, .kpi-card .ico {
      font-family: 'Material Symbols Outlined';
      font-weight: 400; font-style: normal;
      line-height: 1; display: inline-block;
      letter-spacing: normal; text-transform: none; white-space: nowrap;
      -webkit-font-feature-settings: 'liga';
    }

    /* =========================================================
       SHELL
       ========================================================= */
    ps-admin-shell { display: block; min-height: 100vh; }

    /* =========================================================
       TOP APP BAR (Material 3 center-aligned variant)
       ========================================================= */
    ps-admin-topbar {
      display: flex; align-items: center; gap: 16px;
      height: var(--topbar-h);
      padding: 0 12px 0 12px;
      background: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      position: sticky; top: 0; z-index: 50;
    }
    ps-admin-topbar .brand-row {
      display: inline-flex; align-items: center; gap: 12px;
      padding-left: 4px;
    }
    ps-admin-topbar .brand {
      font-family: 'Mona Sans', system-ui, sans-serif;
      font-variation-settings: 'wdth' 82, 'wght' 700;
      font-size: 22px; letter-spacing: -0.035em; line-height: 1;
      color: var(--md-sys-color-on-surface);
      display: inline-flex; align-items: baseline; gap: 0;
    }
    ps-admin-topbar .brand .slash {
      color: var(--md-sys-color-primary); font-style: italic;
      font-variation-settings: 'wdth' 92, 'wght' 500;
    }
    ps-admin-topbar .admin-tag {
      font-family: 'Roboto Flex', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--md-sys-color-on-primary);
      background: var(--md-sys-color-primary);
      padding: 4px 10px; border-radius: 4px;
    }
    ps-admin-topbar .spacer { flex: 1; }
    ps-admin-topbar .actions { display: inline-flex; align-items: center; gap: 4px; }
    ps-admin-topbar .avatar {
      width: 36px; height: 36px; margin-left: 8px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    /* =========================================================
       LAYOUT — rail + main
       ========================================================= */
    .admin-layout {
      display: grid;
      grid-template-columns: var(--rail-w) 1fr;
      min-height: calc(100vh - var(--topbar-h));
    }

    /* =========================================================
       NAVIGATION DRAWER (Material 3 standard drawer pattern)
       ========================================================= */
    ps-admin-nav-rail {
      display: block;
      background: var(--md-sys-color-surface-container-low);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      padding: 16px 12px;
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      overflow-y: auto;
      overflow-x: hidden;
    }
    ps-admin-nav-rail .group { display: flex; flex-direction: column; gap: 2px; }
    ps-admin-nav-rail .nav-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
      padding: 16px 16px 8px;
    }
    ps-admin-nav-rail .nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-radius: 999px;
      color: var(--md-sys-color-on-surface-variant);
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.005em;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
      position: relative;
      min-width: 0;
    }
    ps-admin-nav-rail .nav-item .ico { flex: 0 0 auto; }
    ps-admin-nav-rail .nav-item .label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    ps-admin-nav-rail .nav-item .badge { flex: 0 0 auto; }
    ps-admin-nav-rail .nav-item:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
      color: var(--md-sys-color-on-surface);
    }
    ps-admin-nav-rail .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-weight: 600;
    }
    ps-admin-nav-rail .nav-item .ico { font-size: 22px; }
    ps-admin-nav-rail .nav-item.active .ico {
      font-variation-settings: 'FILL' 1;
    }
    ps-admin-nav-rail .badge {
      margin-left: auto;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 11px; font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      line-height: 1.5;
    }

    /* =========================================================
       MAIN
       ========================================================= */
    main.admin-main {
      padding: 32px 40px 96px;
      max-width: 1480px;
      width: 100%;
      min-width: 0;
    }

    /* Page header */
    .page-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; margin-bottom: 32px; flex-wrap: wrap;
    }
    .page-header h1 {
      font-family: 'Roboto Flex', sans-serif;
      font-weight: 400; font-size: 36px;
      letter-spacing: 0; line-height: 1.1;
      margin: 0 0 8px;
      color: var(--md-sys-color-on-surface);
    }
    .page-header .updated {
      font-size: 14px; color: var(--md-sys-color-on-surface-variant);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .page-header .updated .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-primary);
      box-shadow: 0 0 0 0 var(--md-sys-color-primary);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(255, 152, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
    }
    .page-header .actions { display: flex; gap: 12px; }

    /* KPI cards */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--md-sys-color-surface-container);
      border-radius: 16px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 10px;
      transition: background .2s ease;
    }
    .kpi-card:hover { background: var(--md-sys-color-surface-container-high); }
    .kpi-card .label {
      font-size: 14px; font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      display: flex; align-items: center; justify-content: space-between;
    }
    .kpi-card .label .ico {
      font-size: 22px;
      color: var(--md-sys-color-primary);
    }
    .kpi-card .value {
      font-size: 36px; font-weight: 400; letter-spacing: -0.02em;
      color: var(--md-sys-color-on-surface);
      line-height: 1.1;
    }
    .kpi-card .delta {
      font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .kpi-card .delta.up   { color: #6CCFAE; }
    .kpi-card .delta.flat { color: var(--md-sys-color-tertiary); }
    .kpi-card .delta .ico { font-size: 16px; }

    /* 2-col content */
    .content-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    /* Generic card */
    .card {
      background: var(--md-sys-color-surface-container);
      border-radius: 16px;
      overflow: hidden;
    }
    .card-head {
      padding: 20px 24px 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .card-head h2 {
      font-family: 'Roboto Flex', sans-serif;
      font-size: 18px; font-weight: 500; letter-spacing: 0;
      margin: 0; color: var(--md-sys-color-on-surface);
    }
    .card-head .sub {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .card-body { padding: 4px 0 16px; }

    /* Activity feed */
    .activity-list { list-style: none; padding: 0; margin: 0; }
    .activity-item {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 16px; align-items: center;
      padding: 12px 24px;
      transition: background .15s ease;
      cursor: pointer;
    }
    .activity-item:hover { background: var(--md-sys-color-surface-container-high); }
    .activity-item .avatar-sm {
      width: 36px; height: 36px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .activity-item .text {
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      line-height: 1.4;
    }
    .activity-item .text b { font-weight: 600; }
    .activity-item .text .ent {
      color: var(--md-sys-color-primary);
      font-weight: 500;
    }
    .activity-item .time {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
    }

    /* Recent edits table */
    .edits-table { width: 100%; border-collapse: collapse; }
    .edits-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
      padding: 14px 24px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .edits-table td {
      padding: 14px 24px; font-size: 14px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface);
      vertical-align: middle;
    }
    .edits-table tr:last-child td { border-bottom: none; }
    .edits-table tbody tr { transition: background .15s ease; }
    .edits-table tbody tr:hover { background: var(--md-sys-color-surface-container-high); }
    .edits-table .title-cell { font-weight: 500; }
    .edits-table .cat {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
    }
    .edits-table .status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      padding: 4px 10px; border-radius: 999px;
    }
    .edits-table .status.published {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .edits-table .status.draft {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .edits-table .author { display: inline-flex; align-items: center; gap: 10px; }
    .edits-table .author .av {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* FAB */
    .fab-cluster {
      position: fixed; bottom: 32px; right: 32px;
      display: flex; flex-direction: column; gap: 12px; align-items: flex-end;
      z-index: 40;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .content-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 880px) {
      :root { --rail-w: 72px; }
      ps-admin-nav-rail { padding: 12px 8px; }
      ps-admin-nav-rail .nav-label { display: none; }
      ps-admin-nav-rail .nav-item {
        flex-direction: column; gap: 4px; padding: 12px 4px;
        font-size: 10px; text-align: center;
      }
      ps-admin-nav-rail .badge { display: none; }
      ps-admin-nav-rail md-divider { margin: 12px 4px !important; }
      ps-admin-topbar .admin-tag { display: none; }
      main.admin-main { padding: 24px 20px 96px; }
    }
    @media (max-width: 600px) {
      .kpi-row { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .edits-table .cat,
      .edits-table .author .name { display: none; }
    }
  </style>
</head>

<body>
  <ps-admin-shell></ps-admin-shell>

  <script type="module">
    /* =========================================================
       Web Components — same MDN autonomous-element pattern as
       home/signin/catalog. Material 3 components (<md-*>) are
       composed *inside* the section components' templates.
       ========================================================= */

    class LightElement extends HTMLElement {
      connectedCallback() {
        if (this.#rendered) return;
        this.innerHTML = this.render();
        this.#rendered = true;
        this.afterRender?.();
      }
      #rendered = false;
      render() { return ''; }
    }

    class PsAdminShell extends LightElement {
      render() {
        return `
          <ps-admin-topbar></ps-admin-topbar>
          <div class="admin-layout">
            <ps-admin-nav-rail></ps-admin-nav-rail>
            <main class="admin-main">
              <ps-admin-dashboard></ps-admin-dashboard>
            </main>
          </div>
          <div class="fab-cluster">
            <md-fab variant="primary" label="New tutorial">
              <md-icon slot="icon">add</md-icon>
            </md-fab>
          </div>
        `;
      }
    }

    class PsAdminTopbar extends LightElement {
      render() {
        return `
          <md-icon-button aria-label="Toggle menu">
            <md-icon>menu</md-icon>
          </md-icon-button>
          <div class="brand-row">
            <span class="brand">Prompt<span class="slash">/</span>Sharp</span>
            <span class="admin-tag">Admin</span>
          </div>
          <div class="spacer"></div>
          <div class="actions">
            <md-icon-button aria-label="Notifications">
              <md-icon>notifications</md-icon>
            </md-icon-button>
            <md-icon-button aria-label="Help">
              <md-icon>help</md-icon>
            </md-icon-button>
            <div class="avatar" title="Quinntyne Brown">QB</div>
          </div>
        `;
      }
    }

    class PsAdminNavRail extends LightElement {
      render() {
        const items = [
          { ico: 'dashboard',  label: 'Dashboard',  active: true },
          { ico: 'menu_book',  label: 'Tutorials',  badge: '12' },
          { ico: 'category',   label: 'Categories' },
          { ico: 'sell',       label: 'Tags' },
          { ico: 'image',      label: 'Media' },
          { ico: 'group',      label: 'Users' },
        ];
        const itemsHtml = items.map(i => `
          <a class="nav-item ${i.active ? 'active' : ''}">
            <span class="ico">${i.ico}</span>
            <span class="label">${i.label}</span>
            ${i.badge ? `<span class="badge">${i.badge}</span>` : ''}
          </a>
        `).join('');
        return `
          <div class="group">
            <div class="nav-label">Manage</div>
            ${itemsHtml}
          </div>
          <md-divider style="margin: 20px 8px;"></md-divider>
          <div class="group">
            <div class="nav-label">Account</div>
            <a class="nav-item">
              <span class="ico">settings</span>
              <span class="label">Settings</span>
            </a>
            <a class="nav-item">
              <span class="ico">logout</span>
              <span class="label">Sign out</span>
            </a>
          </div>
        `;
      }
    }

    class PsAdminDashboard extends LightElement {
      render() {
        const kpis = [
          { label: 'Tutorials',      value: '412',     ico: 'menu_book',  delta: '+8 this week',        trend: 'up' },
          { label: 'Drafts',         value: '23',      ico: 'edit_note',  delta: '5 awaiting review',   trend: 'flat' },
          { label: 'Authors',        value: '14',      ico: 'group',      delta: '+1 this month',       trend: 'up' },
          { label: 'Views · 30d',    value: '128.4K',  ico: 'visibility', delta: '+12.3%',              trend: 'up' },
        ];
        const kpisHtml = kpis.map(k => `
          <div class="kpi-card">
            <div class="label">${k.label}<span class="ico">${k.ico}</span></div>
            <div class="value">${k.value}</div>
            <div class="delta ${k.trend}">
              <span class="ico">${k.trend === 'up' ? 'trending_up' : 'remove'}</span>
              ${k.delta}
            </div>
          </div>
        `).join('');

        const activities = [
          { who: 'AC', text: '<b>Alex Chen</b> published <span class="ent">Wiring MediatR into a Clean Architecture API</span>',  time: '2 min ago' },
          { who: 'JR', text: '<b>Jamie Ruiz</b> edited <span class="ent">RBAC, properly</span>',                                   time: '34 min ago' },
          { who: 'QB', text: '<b>Quinntyne Brown</b> reviewed <span class="ent">EF Core 9 migrations under load</span>',          time: '1 hr ago' },
          { who: 'SL', text: '<b>Sam Lee</b> uploaded <span class="ent">azure-gateway-diagram.svg</span>',                        time: '3 hr ago' },
          { who: 'PT', text: '<b>Pat Thakur</b> created category <span class="ent">Aspire</span>',                                time: 'Yesterday' },
          { who: 'AC', text: '<b>Alex Chen</b> archived <span class="ent">Old Identity Server tutorial</span>',                   time: 'Yesterday' },
        ];
        const activitiesHtml = activities.map(a => `
          <li class="activity-item">
            <div class="avatar-sm">${a.who}</div>
            <div class="text">${a.text}</div>
            <div class="time">${a.time}</div>
          </li>
        `).join('');

        const edits = [
          { title: 'Wiring MediatR into a Clean Architecture API', cat: '.NET',    av: 'AC', name: 'Alex C.',     updated: '2 min ago',  status: 'published' },
          { title: 'RBAC, properly — claims and policy design',    cat: 'AZURE',   av: 'JR', name: 'Jamie R.',    updated: '34 min ago', status: 'draft' },
          { title: 'Atomic design for Blazor components',          cat: 'BLAZOR',  av: 'QB', name: 'Quinntyne B.',updated: '1 hr ago',   status: 'draft' },
          { title: 'EF Core 9 migrations under load',              cat: 'EF CORE', av: 'AC', name: 'Alex C.',     updated: '3 hr ago',   status: 'published' },
          { title: 'OAuth2 confidential clients, in one sitting',  cat: 'AUTH',    av: 'SL', name: 'Sam L.',      updated: 'Yesterday',  status: 'published' },
        ];
        const editsRows = edits.map(e => `
          <tr>
            <td class="title-cell">${e.title}</td>
            <td class="cat">${e.cat}</td>
            <td><span class="author"><span class="av">${e.av}</span><span class="name">${e.name}</span></span></td>
            <td>${e.updated}</td>
            <td><span class="status ${e.status}">${e.status.toUpperCase()}</span></td>
            <td style="width: 1px; padding-right: 12px;">
              <md-icon-button><md-icon>more_vert</md-icon></md-icon-button>
            </td>
          </tr>
        `).join('');

        return `
          <header class="page-header">
            <div>
              <h1>Dashboard</h1>
              <div class="updated"><span class="pulse"></span>Updated 2 minutes ago · auto-refresh on</div>
            </div>
            <div class="actions">
              <md-outlined-button>
                <md-icon slot="icon">file_download</md-icon>
                Export
              </md-outlined-button>
              <md-filled-button>
                <md-icon slot="icon">add</md-icon>
                New tutorial
              </md-filled-button>
            </div>
          </header>

          <section class="kpi-row">${kpisHtml}</section>

          <section class="content-row">
            <div class="card">
              <div class="card-head">
                <h2>Recent activity</h2>
                <md-text-button>View all</md-text-button>
              </div>
              <div class="card-body">
                <ul class="activity-list">${activitiesHtml}</ul>
              </div>
            </div>

            <div class="card">
              <div class="card-head">
                <h2>Quick actions</h2>
                <span class="sub">Common admin tasks</span>
              </div>
              <div class="card-body" style="padding: 0 0 12px;">
                <md-list>
                  <md-list-item type="button">
                    <md-icon slot="start">post_add</md-icon>
                    <div slot="headline">New tutorial</div>
                    <div slot="supporting-text">Create a step-by-step guide</div>
                    <md-icon slot="end">chevron_right</md-icon>
                  </md-list-item>
                  <md-divider></md-divider>
                  <md-list-item type="button">
                    <md-icon slot="start">category</md-icon>
                    <div slot="headline">New category</div>
                    <div slot="supporting-text">Group tutorials by Microsoft tech</div>
                    <md-icon slot="end">chevron_right</md-icon>
                  </md-list-item>
                  <md-divider></md-divider>
                  <md-list-item type="button">
                    <md-icon slot="start">upload_file</md-icon>
                    <div slot="headline">Upload media</div>
                    <div slot="supporting-text">Images and assets</div>
                    <md-icon slot="end">chevron_right</md-icon>
                  </md-list-item>
                  <md-divider></md-divider>
                  <md-list-item type="button">
                    <md-icon slot="start">person_add</md-icon>
                    <div slot="headline">Assign role</div>
                    <div slot="supporting-text">Editor / Admin permissions</div>
                    <md-icon slot="end">chevron_right</md-icon>
                  </md-list-item>
                </md-list>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>Recent edits</h2>
              <md-text-button trailing-icon>
                View all tutorials
                <md-icon slot="icon">arrow_forward</md-icon>
              </md-text-button>
            </div>
            <div class="card-body" style="padding: 0;">
              <table class="edits-table">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Author</th>
                    <th>Updated</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>${editsRows}</tbody>
              </table>
            </div>
          </section>
        `;
      }
    }

    customElements.define('ps-admin-shell',     PsAdminShell);
    customElements.define('ps-admin-topbar',    PsAdminTopbar);
    customElements.define('ps-admin-nav-rail',  PsAdminNavRail);
    customElements.define('ps-admin-dashboard', PsAdminDashboard);
  </script>
</body>
</html>
