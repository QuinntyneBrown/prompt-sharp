<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptSharp — Sign in / v1 Skeleton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       PromptSharp v1 · Sign in (skeleton)
       One screen for sign-in and sign-up. Magic link + OAuth.
       ========================================================= */

    :root {
      --bg:         #00000F;
      --surface:    #002A54;
      --rule:       #003E80;
      --rule-soft:  #001A36;

      --ink:        #FBFFFF;
      --ink-dim:    #C5CDE4;
      --muted:      #6B7AAF;
      --hush:       #3A4880;

      --accent:     #FF9800;
      --accent-2:   #8AA8FF;

      --sans:       "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:       "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

      --gutter:     clamp(20px, 4vw, 48px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    html { background: var(--bg); }
    body {
      font-family: var(--sans);
      font-variation-settings: "wdth" 100, "wght" 400;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(255, 152, 0, 0.10), transparent 60%),
        radial-gradient(700px 400px at 50% 110%, rgba(138, 168, 255, 0.06), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(251, 255, 255, 0.01) 3px 4px);
    }

    /* ---------- Nav ---------- */
    ps-nav { display: block; position: relative; z-index: 2; }
    ps-nav .inner {
      display: flex; justify-content: center;
      padding: 28px var(--gutter);
    }
    .brand {
      font-family: var(--sans);
      font-variation-settings: "wdth" 82, "wght" 700;
      font-size: 22px;
      letter-spacing: -0.035em;
      line-height: 1;
      display: inline-flex; align-items: baseline; gap: 0;
      color: var(--ink); text-decoration: none;
    }
    .brand .slash {
      color: var(--accent); font-style: italic;
      font-variation-settings: "wdth" 92, "wght" 500;
    }

    /* =========================================================
       Card
       ========================================================= */
    ps-shell {
      display: flex; flex: 1;
      align-items: center; justify-content: center;
      padding: 24px var(--gutter) 48px;
      position: relative; z-index: 1;
    }
    .card {
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--rule);
      background: var(--surface);
      padding: 40px 36px 32px;
      position: relative;
    }
    .card::before {
      content: "ACCESS";
      position: absolute; top: -1px; left: -1px;
      background: var(--accent); color: var(--bg);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
      padding: 5px 11px; font-weight: 600;
    }
    .card h1 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 80, "wght" 600;
      font-size: clamp(28px, 4vw, 36px);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 12px 0 8px;
      color: var(--ink);
    }
    .card h1 em {
      font-style: italic; color: var(--accent);
      font-variation-settings: "wdth" 90, "wght" 500;
    }
    .card .sub {
      color: var(--ink-dim); font-size: 14px;
      margin: 0 0 28px;
    }

    /* Form */
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .field label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-variation-settings: "wdth" 95, "wght" 450;
      font-size: 15px;
      outline: none;
      transition: border-color .2s ease;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--hush); }

    .btn {
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 18px; border: 1px solid var(--rule);
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink); background: transparent; cursor: pointer;
      line-height: 1;
    }
    .btn.solid { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .btn.ghost:hover { border-color: var(--ink-dim); color: var(--ink); }
    .btn .ico {
      display: inline-flex; align-items: center;
      width: 16px; height: 16px;
    }
    .btn .ico svg { width: 100%; height: 100%; }

    /* OAuth divider */
    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 14px;
      margin: 22px 0;
    }
    .divider .line { height: 1px; background: var(--rule-soft); }
    .divider .label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted);
    }

    .oauth { display: flex; flex-direction: column; gap: 10px; }

    .fineprint {
      margin-top: 22px; padding-top: 18px;
      border-top: 1px solid var(--rule-soft);
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 0.04em;
      line-height: 1.6;
    }
    .fineprint a { color: var(--ink-dim); }

    /* Footer */
    ps-footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--rule-soft);
    }
    .foot-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px var(--gutter);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    .foot-inner .links { display: flex; gap: 22px; }
    .foot-inner .links span { cursor: pointer; }

    @media (max-width: 720px) {
      .card { padding: 36px 24px 28px; }
      .foot-inner { flex-direction: column; gap: 10px; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <ps-nav></ps-nav>
  <ps-shell></ps-shell>
  <ps-footer></ps-footer>

  <script type="module">
    class LightElement extends HTMLElement {
      connectedCallback() {
        if (this.#rendered) return;
        this.innerHTML = this.render();
        this.#rendered = true;
      }
      #rendered = false;
      render() { return ""; }
    }

    class PsNav extends LightElement {
      render() {
        return `
          <div class="inner">
            <a class="brand" href="home.html">Prompt<span class="slash">/</span>Sharp</a>
          </div>
        `;
      }
    }

    class PsShell extends LightElement {
      render() {
        return `
          <div class="card">
            <h1>Sign <em>in</em></h1>
            <p class="sub">Save your projects. Download your prompts. Pick up where you left off.</p>

            <form onsubmit="event.preventDefault()">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
              </div>
              <button type="submit" class="btn solid">Send magic link →</button>
            </form>

            <div class="divider">
              <div class="line"></div>
              <div class="label">or</div>
              <div class="line"></div>
            </div>

            <div class="oauth">
              <button class="btn ghost">
                <span class="ico">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.93h5.35c-.23 1.4-1.66 4.12-5.35 4.12-3.22 0-5.85-2.67-5.85-5.95s2.63-5.95 5.85-5.95c1.83 0 3.06.78 3.76 1.45l2.56-2.46C16.74 3.91 14.6 3 12 3 6.96 3 2.87 7.04 2.87 12s4.09 9 9.13 9c5.27 0 8.76-3.7 8.76-8.92 0-.6-.06-1.05-.41-.98z"/></svg>
                </span>
                Continue with Google
              </button>
              <button class="btn ghost">
                <span class="ico">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.36 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.72-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.05A9.43 9.43 0 0 1 12 6.84c.85 0 1.71.12 2.51.34 1.91-1.32 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.35 4.81-4.58 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49C19.13 20.61 22 16.78 22 12.25 22 6.58 17.52 2 12 2z"/></svg>
                </span>
                Continue with GitHub
              </button>
            </div>

            <div class="fineprint">
              By continuing, you agree to our <a>Terms</a> and <a>Privacy Policy</a>. New here? An account is created automatically.
            </div>
          </div>
        `;
      }
    }

    class PsFooter extends LightElement {
      render() {
        return `
          <div class="foot-inner">
            <span>© 2026 · Prompt/Sharp</span>
            <div class="links">
              <span>About</span>
              <span>Privacy</span>
              <span>Terms</span>
            </div>
          </div>
        `;
      }
    }

    customElements.define("ps-nav",    PsNav);
    customElements.define("ps-shell",  PsShell);
    customElements.define("ps-footer", PsFooter);
  </script>
</body>
</html>
