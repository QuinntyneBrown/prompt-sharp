<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptSharp — Projects / v1 Skeleton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       PromptSharp v1 · Projects list (skeleton)
       The user's library of past builds. One click to resume.
       ========================================================= */

    :root {
      --bg:         #00000F;
      --surface:    #002A54;
      --rule:       #003E80;
      --rule-soft:  #001A36;

      --ink:        #FBFFFF;
      --ink-dim:    #C5CDE4;
      --muted:      #6B7AAF;
      --hush:       #3A4880;

      --accent:     #FF9800;
      --accent-2:   #8AA8FF;

      --sans:       "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:       "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

      --max-w:      1100px;
      --gutter:     clamp(20px, 4vw, 48px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: var(--sans);
      font-variation-settings: "wdth" 100, "wght" 400;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 90% -10%, rgba(255, 152, 0, 0.07), transparent 60%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(251, 255, 255, 0.01) 3px 4px);
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Nav ---------- */
    ps-nav {
      display: block;
      position: sticky; top: 0;
      border-bottom: 1px solid var(--rule);
      background: rgba(0, 0, 15, 0.82);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      z-index: 50;
    }
    ps-nav .inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 32px;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 18px var(--gutter);
    }
    .brand {
      font-family: var(--sans);
      font-variation-settings: "wdth" 82, "wght" 700;
      font-size: 22px;
      letter-spacing: -0.035em;
      line-height: 1;
      display: inline-flex; align-items: baseline; gap: 0;
      color: var(--ink); text-decoration: none;
    }
    .brand .slash {
      color: var(--accent); font-style: italic;
      font-variation-settings: "wdth" 92, "wght" 500;
    }
    ps-nav .actions {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 18px; border: 1px solid var(--rule);
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink); background: transparent; cursor: pointer;
      line-height: 1;
    }
    .btn.solid { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .btn.ghost { color: var(--ink-dim); }
    .btn.ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
    .btn.sm { padding: 7px 12px; font-size: 11px; }

    /* ---------- Shell ---------- */
    ps-shell {
      display: block;
      position: relative; z-index: 1;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    /* =========================================================
       HEAD
       ========================================================= */
    ps-head {
      display: block;
      padding: 56px 0 32px;
    }
    ps-head .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
    }
    ps-head h1 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 78, "wght" 600;
      font-size: clamp(36px, 5vw, 56px);
      letter-spacing: -0.035em;
      line-height: 1;
      margin: 12px 0 0;
    }
    ps-head h1 em {
      font-style: italic; color: var(--accent);
      font-variation-settings: "wdth" 88, "wght" 500;
    }

    /* Search/filter bar */
    ps-tools {
      display: block;
      padding: 0 0 24px;
    }
    .tools-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      border: 1px solid var(--rule);
      background: var(--surface);
      padding: 4px 4px 4px 18px;
    }
    .tools-row input {
      border: 0; background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-variation-settings: "wdth" 95, "wght" 450;
      font-size: 15px;
      padding: 10px 0;
      outline: none;
    }
    .tools-row input::placeholder { color: var(--hush); }
    .filters { display: flex; gap: 6px; font-family: var(--mono); font-size: 11px; }
    .filter-chip {
      padding: 6px 12px; border: 1px solid transparent;
      color: var(--muted); cursor: pointer;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .filter-chip.active { color: var(--ink); border-color: var(--rule); background: var(--bg); }

    /* =========================================================
       PROJECTS LIST
       ========================================================= */
    ps-list { display: block; padding-bottom: 64px; }
    .proj-list {
      display: flex; flex-direction: column;
      border-top: 1px solid var(--rule);
    }
    .proj {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--rule-soft);
      cursor: pointer;
      transition: background .15s ease;
    }
    .proj:hover { background: rgba(0, 42, 84, 0.4); }
    .proj .num {
      font-family: var(--mono);
      font-size: 12px; color: var(--muted);
      letter-spacing: 0.1em;
      padding-left: 4px;
    }
    .proj .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .proj h3 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 90, "wght" 500;
      font-size: 17px; letter-spacing: -0.015em;
      line-height: 1.3; margin: 0;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .proj .meta {
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 0.08em;
      display: flex; gap: 16px;
    }
    .proj .meta .sep { color: var(--hush); }
    .proj .right {
      display: flex; gap: 24px; align-items: center;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .proj .status {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--ink-dim);
    }
    .proj .status::before {
      content: ""; width: 7px; height: 7px;
      background: var(--accent-2);
    }
    .proj .status.done::before { background: var(--accent); }
    .proj .arr { color: var(--muted); font-size: 18px; }
    .proj:hover .arr { color: var(--accent); }

    /* =========================================================
       Footer
       ========================================================= */
    ps-footer {
      display: block;
      border-top: 1px solid var(--rule-soft);
      position: relative; z-index: 1;
    }
    .foot-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 18px var(--gutter);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    .foot-inner .links { display: flex; gap: 22px; }
    .foot-inner .links span { cursor: pointer; }

    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      ps-head .row { grid-template-columns: 1fr; align-items: start; }
      .tools-row { grid-template-columns: 1fr; }
      .filters { padding: 0 14px 10px; flex-wrap: wrap; }
      .proj { grid-template-columns: 1fr auto; gap: 12px; }
      .proj .num { display: none; }
      .proj .right { gap: 12px; }
      .foot-inner { flex-direction: column; gap: 10px; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <ps-nav></ps-nav>
  <ps-shell></ps-shell>
  <ps-footer></ps-footer>

  <script type="module">
    class LightElement extends HTMLElement {
      connectedCallback() {
        if (this.#rendered) return;
        this.innerHTML = this.render();
        this.#rendered = true;
      }
      #rendered = false;
      render() { return ""; }
    }

    class PsShell extends LightElement {
      render() {
        return `
          <ps-head></ps-head>
          <ps-tools></ps-tools>
          <ps-list></ps-list>
        `;
      }
    }

    class PsNav extends LightElement {
      render() {
        return `
          <div class="inner">
            <a class="brand" href="home.html">Prompt<span class="slash">/</span>Sharp</a>
            <div></div>
            <div class="actions">
              <a class="btn solid sm" href="home.html">+ New project</a>
              <a class="btn ghost sm" href="account.html">Account</a>
            </div>
          </div>
        `;
      }
    }

    class PsHead extends LightElement {
      render() {
        return `
          <div class="row">
            <div>
              <div class="eyebrow">12 projects · 4 in progress</div>
              <h1>Your <em>projects</em></h1>
            </div>
          </div>
        `;
      }
    }

    class PsTools extends LightElement {
      render() {
        return `
          <div class="tools-row">
            <input type="search" placeholder="Search by idea, tag, or prompt…" />
            <div class="filters">
              <span class="filter-chip active">All</span>
              <span class="filter-chip">In progress</span>
              <span class="filter-chip">Shipped</span>
              <span class="filter-chip">Archived</span>
            </div>
          </div>
        `;
      }
    }

    class PsList extends LightElement {
      render() {
        const projects = [
          { n: "0142", title: "A markdown note-taking app with realtime sync, end-to-end encryption, and OAuth", prompts: 14, when: "4m ago", status: "in progress" },
          { n: "0141", title: "A focus timer for ADHD brains, with a one-button mode and visible body-doubling", prompts: 38, when: "3h ago", status: "in progress" },
          { n: "0140", title: "A team retro tool with anonymous voting and AI summary", prompts: 29, when: "yesterday", status: "in progress" },
          { n: "0139", title: "A wedding RSVP site that doesn't suck", prompts: 21, when: "2d ago", status: "shipped", done: true },
          { n: "0138", title: "A static blog with MDX and full-text search", prompts: 18, when: "4d ago", status: "shipped", done: true },
          { n: "0137", title: "An invoice tool with Stripe checkout and PDF export", prompts: 32, when: "1w ago", status: "shipped", done: true },
          { n: "0136", title: "A habit tracker with streaks and weekly reviews", prompts: 24, when: "1w ago", status: "in progress" },
          { n: "0135", title: "A realtime chat app with AI moderation", prompts: 41, when: "2w ago", status: "shipped", done: true },
          { n: "0134", title: "A meal planner that respects dietary restrictions", prompts: 27, when: "3w ago", status: "shipped", done: true },
        ];

        const rows = projects.map(p => `
          <a class="proj" href="project.html">
            <div class="num">№ ${p.n}</div>
            <div class="body">
              <h3>${p.title}</h3>
              <div class="meta">
                <span>${p.prompts} prompts</span>
                <span class="sep">·</span>
                <span>${p.when}</span>
              </div>
            </div>
            <div class="right">
              <span class="status${p.done ? " done" : ""}">${p.status}</span>
              <span class="arr">→</span>
            </div>
          </a>
        `).join("");

        return `<div class="proj-list">${rows}</div>`;
      }
    }

    class PsFooter extends LightElement {
      render() {
        return `
          <div class="foot-inner">
            <span>© 2026 · Prompt/Sharp</span>
            <div class="links">
              <span>About</span>
              <span>Privacy</span>
              <span>Terms</span>
            </div>
          </div>
        `;
      }
    }

    customElements.define("ps-nav",    PsNav);
    customElements.define("ps-head",   PsHead);
    customElements.define("ps-tools",  PsTools);
    customElements.define("ps-list",   PsList);
    customElements.define("ps-shell",  PsShell);
    customElements.define("ps-footer", PsFooter);
  </script>
</body>
</html>
