<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptSharp — Home / v1 Skeleton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       PromptSharp v1 · Home (skeleton)

       Radical simplicity. The page is one question and one box.
       Idea in → step-by-step prompts out → app shipped.

       Design DNA:
         Mona Sans (variable) + IBM Plex Mono
         #00000F bg · #002A54 surface · #FF9800 signal · #8AA8FF cool
       ========================================================= */

    :root {
      --bg:         #00000F;
      --surface:    #002A54;
      --rule:       #003E80;
      --rule-soft:  #001A36;

      --ink:        #FBFFFF;
      --ink-dim:    #C5CDE4;
      --muted:      #6B7AAF;
      --hush:       #3A4880;

      --accent:     #FF9800;
      --accent-2:   #8AA8FF;

      --sans:       "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:       "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

      --max-w:      1200px;
      --gutter:     clamp(20px, 4vw, 48px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body {
      font-family: var(--sans);
      font-variation-settings: "wdth" 100, "wght" 400;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(255, 152, 0, 0.10), transparent 60%),
        radial-gradient(700px 400px at -10% 110%, rgba(138, 168, 255, 0.06), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(251, 255, 255, 0.01) 3px 4px);
    }

    .mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--ink-dim); }

    /* ---------- Nav ---------- */
    ps-nav {
      display: block;
      position: relative; z-index: 2;
    }
    ps-nav .inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 32px;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 22px var(--gutter);
    }
    .brand {
      font-family: var(--sans);
      font-variation-settings: "wdth" 82, "wght" 700;
      font-size: 22px;
      letter-spacing: -0.035em;
      line-height: 1;
      display: inline-flex; align-items: baseline; gap: 0;
      color: var(--ink);
    }
    .brand .slash {
      color: var(--accent); font-style: italic;
      font-variation-settings: "wdth" 92, "wght" 500;
    }
    ps-nav .actions {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 18px; border: 1px solid var(--rule);
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink); background: transparent; cursor: pointer;
      line-height: 1;
    }
    .btn.solid { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .btn.ghost { color: var(--ink-dim); }
    .btn.ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
    .btn .arr { display: inline-block; transform: translateY(-1px); }

    /* =========================================================
       HERO — the page IS the prompt input.
       ========================================================= */
    ps-shell {
      display: block;
      position: relative; z-index: 1;
      flex: 1;
    }
    ps-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(56px, 12vh, 120px) var(--gutter) 48px;
      text-align: center;
    }
    ps-hero h1 {
      font-family: var(--sans);
      font-variation-settings: "wdth" 78, "wght" 600;
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: -0.035em;
      line-height: 1.02;
      margin: 0;
      color: var(--ink);
    }
    ps-hero h1 em {
      font-style: italic;
      font-variation-settings: "wdth" 88, "wght" 500;
      color: var(--accent);
    }

    /* The prompt panel — the only thing that matters */
    .prompt-panel {
      width: 100%;
      border: 1px solid var(--rule);
      background: var(--surface);
      text-align: left;
      transition: border-color .2s ease;
    }
    .prompt-panel:focus-within {
      border-color: var(--accent);
    }
    .prompt-panel textarea {
      display: block;
      width: 100%;
      min-height: 132px;
      resize: vertical;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-variation-settings: "wdth" 98, "wght" 450;
      font-size: clamp(17px, 1.8vw, 19px);
      letter-spacing: -0.005em;
      line-height: 1.5;
      padding: 22px 24px 16px;
      outline: none;
    }
    .prompt-panel textarea::placeholder {
      color: var(--hush);
    }
    .prompt-panel .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 12px 16px 12px 24px;
      border-top: 1px solid var(--rule-soft);
    }
    .prompt-panel .bar .hint {
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 0.06em;
      display: flex; gap: 12px; align-items: center;
    }
    .prompt-panel .bar .hint kbd {
      font-family: var(--mono);
      border: 1px solid var(--rule);
      padding: 2px 6px; font-size: 10px;
      color: var(--ink); background: var(--bg);
      letter-spacing: 0.04em;
    }

    /* Suggestion chips — quiet, no labels, no decoration */
    .examples {
      display: flex;
      gap: 8px; flex-wrap: wrap;
      justify-content: center;
    }
    .ex-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--rule);
      background: transparent;
      font-family: var(--sans);
      font-variation-settings: "wdth" 95, "wght" 450;
      font-size: 13px; color: var(--ink-dim);
      cursor: pointer; line-height: 1.2;
      border-radius: 999px;
      transition: color .15s ease, border-color .15s ease;
    }
    .ex-chip:hover { color: var(--ink); border-color: var(--ink-dim); }

    /* =========================================================
       Footer — one thin line
       ========================================================= */
    ps-footer {
      display: block;
      position: relative; z-index: 1;
      border-top: 1px solid var(--rule-soft);
    }
    .foot-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 18px var(--gutter);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    .foot-inner .links { display: flex; gap: 22px; }
    .foot-inner .links span { cursor: pointer; }
    .foot-inner .links span:hover { color: var(--ink-dim); }

    /* =========================================================
       Responsive
       ========================================================= */
    @media (max-width: 720px) {
      ps-nav .inner { padding: 18px var(--gutter); }
      ps-hero { padding: 56px var(--gutter) 40px; gap: 28px; }
      .prompt-panel textarea { padding: 18px 18px 14px; min-height: 120px; }
      .prompt-panel .bar { padding: 10px 14px; grid-template-columns: 1fr; gap: 10px; }
      .prompt-panel .bar .btn { width: 100%; justify-content: center; }
      .foot-inner { flex-direction: column; gap: 10px; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <ps-nav></ps-nav>
  <ps-shell></ps-shell>
  <ps-footer></ps-footer>

  <script type="module">
    class LightElement extends HTMLElement {
      connectedCallback() {
        if (this.#rendered) return;
        this.innerHTML = this.render();
        this.#rendered = true;
      }
      #rendered = false;
      render() { return ""; }
    }

    class PsShell extends LightElement {
      render() {
        return `<ps-hero></ps-hero>`;
      }
    }

    class PsNav extends LightElement {
      render() {
        return `
          <div class="inner">
            <div class="brand">Prompt<span class="slash">/</span>Sharp</div>
            <div></div>
            <div class="actions">
              <button class="btn ghost">Sign in</button>
            </div>
          </div>
        `;
      }
    }

    class PsHero extends LightElement {
      render() {
        return `
          <h1>What do you want to <em>build?</em></h1>

          <div class="prompt-panel">
            <textarea
              placeholder="Describe the app you want to build…"
            ></textarea>
            <div class="bar">
              <div class="hint">
                <span><kbd>⌘</kbd> + <kbd>↵</kbd> to start</span>
              </div>
              <button class="btn solid">Start <span class="arr">→</span></button>
            </div>
          </div>

          <div class="examples">
            <button class="ex-chip">A habit tracker with streaks</button>
            <button class="ex-chip">An invoicing tool with Stripe</button>
            <button class="ex-chip">A realtime chat app</button>
            <button class="ex-chip">A personal blog with search</button>
          </div>
        `;
      }
    }

    class PsFooter extends LightElement {
      render() {
        return `
          <div class="foot-inner">
            <span>© 2026 · Prompt/Sharp</span>
            <div class="links">
              <span>About</span>
              <span>Privacy</span>
              <span>Terms</span>
            </div>
          </div>
        `;
      }
    }

    customElements.define("ps-nav",    PsNav);
    customElements.define("ps-hero",   PsHero);
    customElements.define("ps-shell",  PsShell);
    customElements.define("ps-footer", PsFooter);
  </script>
</body>
</html>
