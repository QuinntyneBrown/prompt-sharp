<label class="row">
  <input
    #input
    type="checkbox"
    class="box"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.name]="name()"
    [attr.value]="value()"
    (change)="onChange($event)"
  />
  @if (label(); as label) {
    <span class="label">{{ label }}</span>
  }
</label>
