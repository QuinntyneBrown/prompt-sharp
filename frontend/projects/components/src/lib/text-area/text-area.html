@if (label(); as label) {
  <label class="label">{{ label }}</label>
}
<textarea
  class="field"
  [value]="value()"
  [placeholder]="placeholder()"
  [rows]="rows()"
  [attr.name]="name()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [attr.aria-invalid]="error() ? true : null"
  (input)="onInput($event)"
></textarea>
@if (error(); as err) {
  <span class="error" role="alert">{{ err }}</span>
}
