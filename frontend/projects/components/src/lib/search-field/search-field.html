<span class="field" role="search">
  <span class="prefix" aria-hidden="true">⌕</span>
  <input
    class="input"
    type="search"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  @if (value()) {
    <button
      type="button"
      class="clear"
      aria-label="Clear"
      [disabled]="disabled()"
      (click)="onClear()"
    >×</button>
  }
</span>
