@if (open() && modal()) {
  <div class="scrim" aria-hidden="true" (click)="onScrimClick()"></div>
}

<section
  class="dialog"
  role="dialog"
  [cdkTrapFocus]="open() && modal()"
  [cdkTrapFocusAutoCapture]="open() && modal()"
  [attr.aria-modal]="modal() ? 'true' : 'false'"
  [attr.aria-labelledby]="headline() ? titleId : null"
  [attr.aria-describedby]="supportingText() ? descriptionId : null"
  [attr.hidden]="open() ? null : true"
  (keydown.escape)="onEscape($event)"
>
  @if (headline() || supportingText()) {
    <header class="header">
      @if (headline(); as title) {
        <h2 class="title" [id]="titleId">{{ title }}</h2>
      }
      @if (supportingText(); as text) {
        <p class="supporting" [id]="descriptionId">{{ text }}</p>
      }
    </header>
  }

  <div class="body">
    <ng-content></ng-content>
  </div>

  <footer class="actions">
    <ng-content select="[dialog-actions]"></ng-content>
  </footer>
</section>
