<button
  class="btn"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() || null"
>
  @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
  }
  <span class="icon-start"><ng-content select="[icon-start]"></ng-content></span>
  <span class="content"><ng-content></ng-content></span>
  <span class="icon-end"><ng-content select="[icon-end]"></ng-content></span>
</button>
