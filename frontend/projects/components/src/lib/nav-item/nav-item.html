@if (href() && !disabled()) {
  <a
    class="item"
    [href]="href()"
    [attr.aria-current]="active() ? 'page' : null"
    [attr.aria-label]="collapsed() ? label() : null"
    (click)="onClick($event)"
  >
    @if (icon(); as iconName) {
      <span class="material-symbols-outlined" aria-hidden="true">{{ iconName }}</span>
    }
    <span class="label">{{ label() }}</span>
  </a>
} @else {
  <button
    type="button"
    class="item"
    [disabled]="disabled()"
    [attr.aria-current]="active() ? 'page' : null"
    [attr.aria-label]="collapsed() ? label() : null"
    (click)="onClick($event)"
  >
    @if (icon(); as iconName) {
      <span class="material-symbols-outlined" aria-hidden="true">{{ iconName }}</span>
    }
    <span class="label">{{ label() }}</span>
  </button>
}
