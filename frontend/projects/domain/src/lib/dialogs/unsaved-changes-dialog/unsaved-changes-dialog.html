<lib-dialog-shell
  [open]="open()"
  headline="Unsaved changes"
  supportingText="Discard your edits and leave?"
  (closed)="cancelled.emit()"
>
  <div class="admin-dialog-body">
    <p>Your draft has local changes that have not been persisted. Stay on the editor to save them, or discard and continue navigation.</p>
  </div>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Keep editing</lib-button>
    <lib-button variant="danger" (click)="discarded.emit()">Discard</lib-button>
  </div>
</lib-dialog-shell>
