<lib-dialog-shell
  [open]="open()"
  [headline]="headline()"
  [supportingText]="supportingText()"
  [modal]="true"
  (closed)="cancelled.emit()"
>
  <ng-content></ng-content>
  <p>Publishing is immediate. Scheduled publishing is not available for this workspace.</p>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button variant="solid" (click)="submitted.emit()">Publish</lib-button>
  </div>
</lib-dialog-shell>
