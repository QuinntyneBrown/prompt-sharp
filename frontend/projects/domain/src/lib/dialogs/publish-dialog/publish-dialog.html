<lib-dialog-shell
  [open]="open()"
  [headline]="headline()"
  [supportingText]="supportingText()"
  [modal]="true"
  (closed)="cancelled.emit()"
>
  <ng-content></ng-content>
  <div class="publish-checklist">
    <div><span class="material-symbols-outlined" aria-hidden="true">check_circle</span> Metadata is complete</div>
    <div><span class="material-symbols-outlined" aria-hidden="true">check_circle</span> Steps have readable titles</div>
    <div><span class="material-symbols-outlined" aria-hidden="true">schedule</span> Publishing is immediate in this workspace</div>
  </div>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button variant="solid" (click)="submitted.emit()">Publish</lib-button>
  </div>
</lib-dialog-shell>
