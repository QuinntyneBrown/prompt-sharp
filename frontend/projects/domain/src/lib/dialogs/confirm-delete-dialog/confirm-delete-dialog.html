<lib-dialog-shell
  [open]="open()"
  headline="Delete tutorial?"
  [supportingText]="itemName() ? 'This will permanently remove ' + itemName() + '.' : 'This action cannot be undone.'"
  (closed)="cancelled.emit()"
>
  <div class="delete-warning">
    <span class="material-symbols-outlined" aria-hidden="true">warning</span>
    <div>
      <strong>Production content will be removed immediately.</strong>
      <p>Bookmarks and audit history remain, but the deleted asset will no longer be available to readers.</p>
    </div>
  </div>
  <ng-content></ng-content>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button variant="danger" (click)="confirmed.emit()">Delete</lib-button>
  </div>
</lib-dialog-shell>
