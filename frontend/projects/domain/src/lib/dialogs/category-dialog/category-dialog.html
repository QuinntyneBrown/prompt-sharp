<lib-dialog-shell
  [open]="open()"
  headline="New category"
  supportingText="Create a taxonomy category that appears in filters, cards, and editor metadata."
  (closed)="cancelled.emit()"
>
  <div class="admin-dialog-body">
    <lib-text-field label="Name" value=".NET API Foundations"></lib-text-field>
    <lib-text-field label="Slug" value="dotnet-api-foundations"></lib-text-field>
    <lib-text-field label="Order" type="number" value="1"></lib-text-field>
    <ng-content></ng-content>
  </div>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button variant="solid" (click)="submitted.emit({})">Save category</lib-button>
  </div>
</lib-dialog-shell>
