<lib-dialog-shell
  [open]="open()"
  headline="Sign out of Prompt/Sharp?"
  supportingText="Your local session token will be cleared. Bookmarks and progress remain attached to your account."
  (closed)="cancelled.emit()"
>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Stay signed in</lib-button>
    <lib-button variant="solid" (click)="confirmed.emit()">Sign out</lib-button>
  </div>
</lib-dialog-shell>
