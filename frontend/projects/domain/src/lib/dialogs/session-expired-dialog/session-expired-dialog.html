<lib-dialog-shell
  [open]="open()"
  headline="Session expired"
  supportingText="Your protected session timed out. Sign in again to continue from the same page."
  [modal]="true"
>
  <div dialog-actions>
    <lib-button variant="solid" (click)="reauthenticate.emit()">Sign in</lib-button>
  </div>
</lib-dialog-shell>
