<lib-dialog-shell
  [open]="open()"
  headline="Upload media"
  supportingText="Drop an image, SVG, or diagram and confirm the metadata before it is available to tutorials."
  (closed)="cancelled.emit()"
>
  <lib-drop-zone
    label="Upload file"
    description="SVG, PNG, or JPEG files are stored by the backend."
    [disabled]="uploading()"
    (filesSelected)="onFiles($event)"
  ></lib-drop-zone>
  @if (uploading()) {
    <div class="upload-progress">
      <lib-meter
        label="Upload progress"
        tone="accent"
        [value]="uploadPercent() ?? 0"
        [indeterminate]="uploadPercent() === null"
      ></lib-meter>
      <p role="status">
        @if (uploadPercent() !== null) {
          Uploading {{ uploadPercent() }}%
        } @else {
          Uploading…
        }
      </p>
    </div>
  }
  @if (error(); as message) {
    <p role="alert">{{ message }}</p>
  }
  <div class="admin-field-pair">
    <lib-text-field label="Alt text" value="PromptSharp architecture diagram"></lib-text-field>
    <lib-text-field label="Used in" value="MediatR tutorial"></lib-text-field>
  </div>
  <div dialog-actions>
    <lib-button variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button variant="solid">Upload</lib-button>
  </div>
</lib-dialog-shell>
