<form class="ps-panel ps-form-lines" (submit)="submit(); $event.preventDefault()">
  <label class="ps-field-line">
    <span class="sr-only">Name</span>
    <input
      name="name"
      autocomplete="name"
      placeholder="Name"
      [value]="name()"
      [disabled]="submitting()"
      (input)="name.set($any($event.target).value)"
    />
  </label>
  <label class="ps-field-line">
    <span class="sr-only">Email</span>
    <input
      type="email"
      name="email"
      autocomplete="email"
      placeholder="Email"
      [value]="email()"
      [disabled]="submitting()"
      (input)="email.set($any($event.target).value)"
    />
  </label>
  <label class="ps-field-line ps-field-line--message">
    <span class="sr-only">Message</span>
    <textarea
      name="message"
      placeholder="Message"
      [value]="message()"
      [disabled]="submitting()"
      (input)="message.set($any($event.target).value)"
    ></textarea>
  </label>
  <button class="ps-btn ps-btn--solid" type="submit" [disabled]="submitting()">Send</button>
  @if (status(); as message) {
    <p role="status">{{ message }}</p>
  }
  @if (error(); as message) {
    <p role="alert">{{ message }}</p>
  }
</form>
