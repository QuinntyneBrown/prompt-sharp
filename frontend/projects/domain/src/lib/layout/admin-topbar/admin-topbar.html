<header class="admin-topbar">
  <button class="admin-icon-button" type="button" aria-label="Toggle menu">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>

  <a class="admin-topbar__brand" href="/admin" aria-label="Prompt/Sharp admin home">
    <span>Prompt<span class="slash">/</span>Sharp</span>
    <b>Admin</b>
  </a>

  <div class="admin-topbar__spacer"></div>

  <div class="admin-topbar__actions">
    <button class="admin-icon-button" type="button" aria-label="Notifications">
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
    </button>
    <button class="admin-icon-button" type="button" aria-label="Help">
      <span class="material-symbols-outlined" aria-hidden="true">help</span>
    </button>
    <button class="admin-topbar__avatar" type="button" aria-label="Account">
      {{ initials() }}
    </button>
    <button class="admin-topbar__signout" type="button" (click)="signOut.emit()">Sign out</button>
  </div>
</header>
