<aside class="admin-nav-rail" [attr.data-collapsed]="collapsed() || null">
  <nav aria-label="Admin">
    <div class="admin-nav-rail__group">
      <p class="admin-nav-rail__label">Manage</p>
      @for (item of primaryItems; track item.route) {
        <a
          class="admin-nav-rail__item"
          [class.active]="isActive(item)"
          [href]="item.route"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span class="admin-nav-rail__text">{{ item.label }}</span>
          @if (item.badge) {
            <span class="admin-nav-rail__badge">{{ item.badge }}</span>
          }
        </a>
      }
    </div>

    <div class="admin-nav-rail__divider" aria-hidden="true"></div>

    <div class="admin-nav-rail__group">
      <p class="admin-nav-rail__label">System</p>
      @for (item of systemItems; track item.route) {
        <a
          class="admin-nav-rail__item"
          [class.active]="isActive(item)"
          [href]="item.route"
        >
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span class="admin-nav-rail__text">{{ item.label }}</span>
        </a>
      }
      <button class="admin-nav-rail__item" type="button" (click)="signOut.emit()">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        <span class="admin-nav-rail__text">Sign out</span>
      </button>
    </div>
  </nav>
</aside>
