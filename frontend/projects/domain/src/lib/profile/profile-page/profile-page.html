<div class="profile-page">
  <h1>My profile</h1>
  @if (loading()) {
    <p class="state state--loading">Loading…</p>
  } @else if (error(); as message) {
    <div class="state state--error">
      <p>{{ message }}</p>
      <lib-button type="button" (click)="load()">Retry</lib-button>
    </div>
  }
  @if (user(); as u) {
    <h2>{{ u.displayName }}</h2>
    <p>{{ u.email }}</p>
    <p>Roles: {{ u.roles.join(', ') }}</p>
    <p>{{ bookmarks().length }} bookmarks</p>
  }
  <a href="/me/progress">Progress and bookmarks</a>
  <lib-button type="button" variant="ghost" (click)="signOut()">Sign out</lib-button>
  <ps-sign-out-dialog
    [open]="signOutDialogOpen()"
    (cancelled)="cancelSignOut()"
    (confirmed)="confirmSignOut()"
  ></ps-sign-out-dialog>
</div>
