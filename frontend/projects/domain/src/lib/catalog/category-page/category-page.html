<div class="category-page">
  <h1 class="category-page__title">
    {{ routeKind() === 'tag' ? 'Tag' : 'Category' }}:
    {{ category()?.name ?? slug() ?? 'Tutorials' }}
  </h1>
  @if (loading()) {
    <lib-spinner-dot class="state state--loading"></lib-spinner-dot>
  } @else if (error(); as message) {
    <div class="state state--error">
      <p>{{ message }}</p>
      <lib-button type="button" (click)="load()">Retry</lib-button>
    </div>
  }
  <div class="category-page__controls">
    <lib-select-field label="Sort" value="newest" [options]="sortOptions"></lib-select-field>
    <lib-select-field label="Difficulty" value="" [options]="difficultyOptions"></lib-select-field>
  </div>
  @if (tutorials(); as page) {
    <p class="category-page__count">{{ page.totalCount }} tutorials</p>
    <section [attr.data-testid]="routeKind() === 'tag' ? 'tag-tutorials' : 'category-tutorials'">
      @for (tutorial of page.items; track tutorial.id) {
        <ps-tutorial-card
          [title]="tutorial.title"
          [slug]="tutorial.slug"
          [summary]="tutorial.summary"
          [categoryName]="tutorial.categoryName"
          [difficulty]="tutorial.difficultyLevel"
          [estimatedMinutes]="tutorial.estimatedMinutes"
        ></ps-tutorial-card>
      }
    </section>
  }
</div>
