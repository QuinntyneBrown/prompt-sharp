<div class="search-page">
  <h1 class="search-page__title">Search results</h1>
  <lib-search-field
    ariaLabel="Search"
    placeholder="Search tutorials"
    [value]="query()"
    (valueChange)="query.set($event)"
    (searched)="search($event)"
  ></lib-search-field>
  @if (query()) {
    <p>Results for "{{ query() }}"</p>
  }
  @if (loading()) {
    <lib-spinner-dot class="state state--loading"></lib-spinner-dot>
  } @else if (error(); as message) {
    <div class="state state--error">
      <p>{{ message }}</p>
      <lib-button type="button" (click)="load()">Retry</lib-button>
    </div>
  }
  @if (results(); as page) {
    <p class="search-page__count">{{ page.totalCount }} matches</p>
    <section data-testid="search-results">
      @for (tutorial of page.items; track tutorial.id) {
        <ps-tutorial-card
          [title]="tutorial.title"
          [slug]="tutorial.slug"
          [summary]="tutorial.summary"
          [categoryName]="tutorial.categoryName"
          [difficulty]="tutorial.difficultyLevel"
          [estimatedMinutes]="tutorial.estimatedMinutes"
        ></ps-tutorial-card>
      }
    </section>
  }
</div>
