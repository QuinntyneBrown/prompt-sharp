<div class="catalog-page">
  <h1>Tutorial catalog</h1>
  @if (loading()) {
    <p class="state state--loading">Loading…</p>
  } @else if (error(); as message) {
    <div class="state state--error">
      <p>{{ message }}</p>
      <button type="button" (click)="load()">Retry</button>
    </div>
  }
  <div class="catalog-page__controls">
    <label>
      Search tutorials
      <input #searchBox type="text" [value]="searchQuery()" (keydown.enter)="search(searchBox.value)" />
    </label>
    <label>
      Category
      <select #categorySelect (change)="setCategory(categorySelect.value)">
        <option value="">All categories</option>
        @for (category of categories(); track category.id) {
          <option [value]="category.slug">{{ category.name }}</option>
        }
      </select>
    </label>
    <label>
      Difficulty
      <select #difficultySelect (change)="setDifficulty(difficultySelect.value)">
        <option value="">Any difficulty</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </label>
    <label>
      Sort
      <select>
        <option>Newest</option>
        <option>Title</option>
      </select>
    </label>
    <button type="button" (click)="setListView()">List view</button>
    <button type="button" (click)="resetFilters(searchBox)">Reset filters</button>
  </div>
  @if (tutorials(); as page) {
    <p class="catalog-page__count">{{ page.totalCount }} tutorials</p>
    <section data-testid="tutorial-results" [attr.data-view]="viewMode()">
      @for (tutorial of page.items; track tutorial.id) {
        <article data-testid="tutorial-card">
          <h2>
            <a [href]="'/tutorials/' + tutorial.slug">{{ tutorial.title }}</a>
          </h2>
          <p>{{ tutorial.summary }}</p>
        </article>
      }
    </section>
  }
</div>
