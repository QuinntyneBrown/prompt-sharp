<div class="catalog-page">
  <h1>Tutorial catalog</h1>
  @if (loading()) {
    <p class="state state--loading">Loading…</p>
  } @else if (error(); as message) {
    <div class="state state--error">
      <p>{{ message }}</p>
      <lib-button type="button" (click)="load()">Retry</lib-button>
    </div>
  }
  <div class="catalog-page__controls">
    <lib-text-field
      label="Search tutorials"
      [value]="searchQuery()"
      (valueChange)="setSearchQuery($event)"
      (keydown.enter)="search(searchQuery())"
    ></lib-text-field>
    <lib-select-field
      label="Category"
      [value]="categoryFilter() ?? ''"
      [options]="categoryOptions()"
      (valueChange)="setCategory($event)"
    ></lib-select-field>
    <lib-select-field
      label="Difficulty"
      [value]="difficultyFilter() ?? ''"
      [options]="difficultyOptions"
      (valueChange)="setDifficulty($event)"
    ></lib-select-field>
    <lib-select-field label="Sort" value="newest" [options]="sortOptions"></lib-select-field>
    <lib-button type="button" (click)="setListView()">List view</lib-button>
    <lib-button type="button" variant="ghost" (click)="resetFilters()">Reset filters</lib-button>
  </div>
  @if (tutorials(); as page) {
    <p class="catalog-page__count">{{ page.totalCount }} tutorials</p>
    <section data-testid="tutorial-results" [attr.data-view]="viewMode()">
      @for (tutorial of page.items; track tutorial.id) {
        <article data-testid="tutorial-card">
          <h2>
            <a [href]="'/tutorials/' + tutorial.slug">{{ tutorial.title }}</a>
          </h2>
          <p>{{ tutorial.summary }}</p>
        </article>
      }
    </section>
  }
</div>
