<lib-dialog-shell
  [open]="open()"
  headline="Edit tutorial"
  supportingText="Update the tutorial metadata, publishing flags, and editorial tags before continuing in the full editor."
  (closed)="cancelled.emit()"
>
  <form class="admin-tutorial-dialog__form">
    <lib-text-field
      label="Title"
      [value]="title()"
      [required]="true"
      (valueChange)="title.set($event)"
    ></lib-text-field>
    <lib-text-field
      label="Slug"
      [value]="slug()"
      [required]="true"
      (valueChange)="slug.set($event)"
    ></lib-text-field>
    <div class="admin-tutorial-dialog__pair">
      <lib-select-field
        label="Category"
        [value]="categoryId()"
        [options]="categoryOptions()"
        [required]="true"
        placeholder="Choose category"
        (valueChange)="categoryId.set($event)"
      ></lib-select-field>
      <lib-select-field
        label="Difficulty"
        [value]="difficultyLevel()"
        [options]="difficultyOptions"
        [required]="true"
        placeholder="Choose difficulty"
        (valueChange)="setDifficulty($event)"
      ></lib-select-field>
    </div>
    <lib-text-field
      label="Estimated minutes"
      type="number"
      [value]="estimatedMinutes()"
      [required]="true"
      (valueChange)="estimatedMinutes.set($event)"
    ></lib-text-field>
    <lib-text-area
      label="Summary"
      [value]="summary()"
      [rows]="3"
      (valueChange)="summary.set($event)"
    ></lib-text-area>
    <div class="admin-toggle-row">
      <div>
        <div class="t">Editor's pick</div>
        <div class="s">Promote at the top of the home page</div>
      </div>
      <md-switch></md-switch>
    </div>
    <div class="admin-toggle-row">
      <div>
        <div class="t">Featured</div>
        <div class="s">Include in the home page grid</div>
      </div>
      <md-switch selected></md-switch>
    </div>
    @if (validation(); as message) {
      <p role="alert">{{ message }}</p>
    }
    @if (error(); as message) {
      <p role="alert">{{ message }}</p>
    }
  </form>
  <div dialog-actions>
    <lib-button type="button" variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button type="button" variant="solid" (click)="submit()">Save changes</lib-button>
  </div>
</lib-dialog-shell>
