<lib-dialog-shell
  [open]="open()"
  headline="New tutorial"
  supportingText="Create the tutorial metadata first, then continue in the full step editor."
  (closed)="cancelled.emit()"
>
  <form class="admin-tutorial-dialog__form">
    <lib-text-field
      label="Title"
      [value]="title()"
      [required]="true"
      (valueChange)="title.set($event)"
    ></lib-text-field>
    <lib-text-field
      label="Slug"
      [value]="slug()"
      [required]="true"
      (valueChange)="slug.set($event)"
    ></lib-text-field>
    <div class="admin-tutorial-dialog__pair">
      <lib-select-field
        label="Category"
        [value]="categoryId()"
        [options]="categoryOptions()"
        [required]="true"
        placeholder="Choose category"
        (valueChange)="categoryId.set($event)"
      ></lib-select-field>
      <lib-select-field
        label="Difficulty"
        [value]="difficultyLevel()"
        [options]="difficultyOptions"
        [required]="true"
        placeholder="Choose difficulty"
        (valueChange)="setDifficulty($event)"
      ></lib-select-field>
    </div>
    <lib-text-field
      label="Estimated minutes"
      type="number"
      [value]="estimatedMinutes()"
      [required]="true"
      (valueChange)="estimatedMinutes.set($event)"
    ></lib-text-field>
    <lib-text-area
      label="Summary"
      [value]="summary()"
      [rows]="3"
      (valueChange)="summary.set($event)"
    ></lib-text-area>
    @if (validation(); as message) {
      <p role="alert">{{ message }}</p>
    }
    @if (error(); as message) {
      <p role="alert">{{ message }}</p>
    }
  </form>
  <div dialog-actions>
    <lib-button type="button" variant="ghost" (click)="cancelled.emit()">Cancel</lib-button>
    <lib-button type="button" variant="solid" (click)="submit()">Create draft</lib-button>
  </div>
</lib-dialog-shell>
