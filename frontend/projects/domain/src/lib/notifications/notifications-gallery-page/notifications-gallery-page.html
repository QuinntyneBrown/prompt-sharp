<div class="notifications-gallery-page">
  <h1>Notifications</h1>
  <section aria-label="Banner variants">
    <h2>Banner variants</h2>
    @for (variant of variants; track variant.tone) {
      <ps-notification-banner [tone]="variant.tone" [message]="variant.message"></ps-notification-banner>
    }
  </section>

  <section aria-label="Snackbar variants">
    <h2>Snackbar variants</h2>
    <div class="notifications-gallery-page__actions">
      @for (variant of variants; track variant.tone) {
        <lib-button type="button" (click)="showNotification(variant.tone, variant.message)">
          Show {{ variant.label }}
        </lib-button>
      }
    </div>
    <div class="notifications-gallery-page__samples">
      @for (variant of variants; track variant.tone) {
        <lib-snackbar [tone]="variant.tone" [message]="variant.message" [open]="true"></lib-snackbar>
      }
    </div>
  </section>
</div>
