<div class="sign-in-page">
  <nav class="sign-in-nav" aria-label="Authentication">
    <div class="sign-in-nav__inner">
      <a class="sign-in-brand" href="/">Prompt<span class="slash">/</span>Sharp</a>
      <a class="sign-in-back" href="/"><span class="arr">←</span> Back to tutorials</a>
    </div>
  </nav>

  <main class="sign-in-stage">
    <section class="sign-in-card" aria-label="Sign in">
      <div class="sign-in-card__head">
        <span class="ps-eyebrow"><span class="dot"></span>Welcome back</span>
        <h1>Sign in to<br />Prompt<em>/</em>Sharp.</h1>
        <p>Pick up where you left off — your progress and bookmarks stay with you.</p>
      </div>

      <form class="sign-in-form" (submit)="submitCredentials(); $event.preventDefault()">
        <label class="sign-in-field">
          <span class="sign-in-field__label" data-index="01">Username</span>
          <input
            name="username"
            type="text"
            placeholder="you@example.com"
            autocomplete="username"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
          />
        </label>

        <label class="sign-in-field">
          <span class="sign-in-field__label" data-index="02">Password</span>
          <span class="sign-in-field__wrap">
            <input
              class="has-eye"
              name="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              placeholder="••••••••••"
              autocomplete="current-password"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
            />
            <button
              type="button"
              class="sign-in-eye"
              [class.revealed]="passwordVisible()"
              [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
              (click)="togglePasswordVisibility()"
            >
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
                <path d="M3 3l18 18" />
                <path d="M10.6 6.2A11 11 0 0 1 12 6c6.5 0 10 6 10 6a14.7 14.7 0 0 1-3.2 3.8" />
                <path d="M6.2 7.6A14.7 14.7 0 0 0 2 12s3.5 6 10 6c1.6 0 3-.3 4.3-.9" />
                <path d="M9.5 9.5a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </span>
        </label>

        <div class="sign-in-options">
          <label class="sign-in-check">
            <input
              type="checkbox"
              name="remember"
              [checked]="rememberMe()"
              (change)="rememberMe.set($any($event.target).checked)"
            />
            <span class="box"></span>
            <span class="lbl">Remember me</span>
          </label>
          <button type="button" class="sign-in-forgot" (click)="goForgotPassword()">Forgot password?</button>
        </div>

        <button type="submit" class="sign-in-submit">Sign in <span class="arr">→</span></button>
      </form>

      <p class="sign-in-legal">
        By continuing you agree to our <a href="/legal/terms">Terms</a> and <a href="/legal/privacy">Privacy Policy</a>.
      </p>

      @if (error(); as message) {
        <p role="alert">{{ message }}</p>
      }
    </section>
  </main>

  <footer class="sign-in-foot">
    <span>© 2026 · Prompt/Sharp</span>
    <nav class="sign-in-foot__links" aria-label="Legal">
      <a href="/legal/privacy">Privacy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/status">Status</a>
    </nav>
  </footer>
</div>
