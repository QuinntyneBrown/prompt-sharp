<section class="ps-center-stage oauth-consent-page">
  <article class="ps-panel ps-center-card">
    <div class="ps-foot-mark oauth-consent-page__mark">Prompt<em>/</em>Sharp</div>
    <h1 class="ps-display ps-consent-heading">Prompt/Sharp wants to access your Microsoft account</h1>
    <div class="ps-mono">Signed in as quinntyne@example.com</div>
    <div class="ps-rule ps-rule--spaced" aria-hidden="true"></div>

    <div class="ps-skeleton-stack">
      @for (scope of scopes; track scope.label) {
        <div class="ps-label-value">
          <span class="label">Scope</span>
          <span class="oauth-consent-page__scope">{{ scope.description }}</span>
        </div>
      }
    </div>

    @if (status(); as message) {
      <p role="status">{{ message }}</p>
    }

    <div class="ps-cta-row">
      <button type="button" class="ps-btn ps-btn--solid" (click)="allow()">Allow</button>
      <button type="button" class="ps-btn ps-btn--ghost" (click)="deny()">Deny</button>
    </div>
  </article>
</section>
