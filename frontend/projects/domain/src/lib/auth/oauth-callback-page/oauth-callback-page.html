<section class="ps-center-stage oauth-callback-page">
  <article class="ps-panel ps-center-card">
    <div class="ps-meta-row"><span class="ps-spin-dot"></span><span class="ps-eyebrow">AUTHENTICATING…</span></div>
    <h1 class="ps-display ps-auth-heading">Returning to <em>Prompt/Sharp</em></h1>
    <span class="sk-tile ps-auth-tile" aria-hidden="true"></span>
    <div class="ps-skeleton-stack oauth-callback-page__lines" aria-hidden="true">
      <span class="sk-line" style="width: 94%"></span>
      <span class="sk-line" data-delay="1" style="width: 68%"></span>
    </div>
    <div class="ps-meta-row oauth-callback-page__meta">
      <span>Provider: {{ provider() }}</span>
      <span>Returning to: {{ returnUrl() }}</span>
    </div>
    <div class="ps-cta-row">
      <a class="ps-btn ps-btn--ghost" href="/sign-in">Cancel</a>
    </div>
    @if (error(); as message) {
      <p role="alert">{{ message }}</p>
    }
  </article>
</section>
